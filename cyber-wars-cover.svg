<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Cyber Wars — Neon City cover art</title><desc id="desc">A futuristic neon city under attack, with a heroic armored fighter and flying spacecraft.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07132f"/><stop offset=".55" stop-color="#24104a"/><stop offset="1" stop-color="#080719"/></linearGradient>
